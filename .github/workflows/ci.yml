name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://mail.thecomputerplumbers.com
    concurrency:
      group: inbox-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy existing inbox Worker
        run: npx --no-install wrangler deploy --message "GitHub Actions ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e6c625b0e930468e2f9a4a036373f4c1
      - name: Verify Cloudflare Access still protects the inbox
        run: |
          node --input-type=module <<'JS_CHECK'
          const response = await fetch('https://mail.thecomputerplumbers.com/', {
            redirect: 'manual', signal: AbortSignal.timeout(30000),
          });
          const location = response.headers.get('location');
          if (response.status !== 302 || !location ||
              new URL(location).hostname !== 'onticord.cloudflareaccess.com') {
            throw new Error('Expected the inbox to redirect to Onticord Cloudflare Access');
          }
          console.log('Inbox is reachable and protected by Cloudflare Access');
          JS_CHECK
